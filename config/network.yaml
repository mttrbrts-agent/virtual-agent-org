# Network-wide settings. Changes here are reviewed PRs, merged by the owner.

network:
  name: virtual-agent-org
  timezone: Europe/London
  # Phase gates: an agent is deployed only when its phase <= current_phase.
  # Phase 0 (foundations) runs the Phase 1 agents against the sandbox repo only:
  # github.repos stays empty, schedules stay off and the gateway stays in DRY_RUN.
  current_phase: 1
  # Scheduled runs (check-ins, triage passes). Off until the Phase 0 gate passes.
  schedules_enabled: true

github:
  org: accordproject
  # Phase 0 runs only against the sandbox repo. Add real repos in Phase 1.
  sandbox_repo: accordproject/virtual-agent-org-sandbox
  # The network's own code (decision 51). Never in repos: only Mandla's tasks touch it.
  network_repo: accordproject/virtual-agent-org
  # Add a repo with `npm run repo:add owner/name`; it also checks the GitHub side.
  repos:
    - accordproject/concerto
    - accordproject/template-engine
    - accordproject/template-playground
    - accordproject/concerto-codegen
    - accordproject/apap

telegram:
  # Numeric Telegram user IDs. Set the real values as Worker secrets, not here;
  # these role names are what the gateway checks.
  roles:
    owner:
      can: [instruct, approve, reject, pause, resume, stop, revoke, ask, status, queue]
    tsc_member:
      can: [ask, status, queue, comment]

budgets:
  # Monthly API credit budget (USD).
  monthly_credit_usd: 200
  # Alert in Ada's check-in when forecast spend exceeds this share of credits.
  forecast_alert_ratio: 0.8
  # Vera flags any agent whose weekly spend exceeds this multiple of its trailing median.
  anomaly_spend_multiple: 1.5
  # Messages each member (anyone in people.yaml but the owner) may send the agents per
  # day, across Telegram and Discord. Over it, they're told to try tomorrow.
  member_daily_messages: 20
  # Ada is woken when a task ends blocked or an approved decision fails (decision 50).
  # At most this many wakes a day (UTC), one per task or decision; 0 turns it off.
  # Wakes also need schedules_enabled. Worst case: wakes x budget a day.
  follow_up_daily_wakes: 5
  # Session budget for each wake (USD).
  follow_up_budget_usd: 0.50
  # Mira is woken when GitHub events call for it (decision 62): to review a PR when CI
  # finishes at a head not yet reviewed, to propose a merge when every merge check
  # passes at a reviewed head, and to first-respond to a first-time contributor.
  # daily: wakes per day (UTC) for that trigger; 0 turns it off. usd: each session's
  # budget. Wakes also need schedules_enabled.
  github_wakes:
    review: { daily: 6, usd: 1.00 }
    merge: { daily: 6, usd: 0.50 }
    first_response: { daily: 10, usd: 0.50 }
  # Session budget for each of Mandla's tasks (USD): small is wording and tier changes,
  # large is tool changes and the owner-only types.
  mechanic_small_usd: 1
  mechanic_large_usd: 5

# The self-improvement loop (decision 55).
self_improvement:
  since: 2026-11-03      # ISO date the loop starts; null = off
  stale_days: 30         # matches .github/workflows/stale.yml
  # While the network settles, Ada may propose changes to an agent as often as the owner
  # asks, from the start. Once settled: proposal_gap_days 7, min_days 14.
  proposal_gap_days: 0   # days between proposals for one agent; 0 = no limit
  min_decided: 10        # proposals need this many decided decisions by the agent...
  min_days: 0            # ...or this many days since `since`
  # Author of the gateway's commits to the network repo: the GitHub App's bot user
  # (gh api "/users/<app slug>[bot]" gives the id).
  commit_author: { name: "mira-accord-project[bot]", email: "350694384+mira-accord-project[bot]@users.noreply.github.com" }

agents:
  # name: phase in which the agent is first deployed
  ada: 1
  mira: 1
  vera: 1
  otto: 1
  mandla: 1
  rosa: 2
  juno: 2
  sage: 1
  kit: 3
  felix: 3
  nell: 3
